name: Nightly

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  fuzz:
    name: fuzz ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset:
          - clang-fuzz-asan
          - clang-fuzz-ubsan
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          # Retry with a per-attempt timeout so a hung apt mirror fails fast.
          for i in 1 2 3 4 5; do
            sudo timeout 150 apt-get update \
              && sudo timeout 240 apt-get install -y ninja-build libclang-rt-18-dev \
              && exit 0
            echo "apt attempt $i failed or timed out; retrying in 10s" >&2
            sleep 10
          done
          echo "apt did not succeed after 5 attempts" >&2
          exit 1
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      # The corpus rolls forward between nights: each run restores the newest
      # cache and saves what it grew, so coverage accumulates instead of
      # restarting from the fixture seeds every time.
      - name: Restore corpus
        uses: actions/cache@v4
        with:
          path: fuzz-corpus-${{ matrix.preset }}
          key: fuzz-corpus-${{ matrix.preset }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.preset }}-
      - name: Seed corpus from the fixture
        run: |
          ./build/${{ matrix.preset }}/tools/ob_fuzz_seed \
            tests/data/fixture.itch fuzz-corpus-${{ matrix.preset }}
      - name: Fuzz for 10 minutes
        run: |
          mkdir -p fuzz-artifacts
          ./build/${{ matrix.preset }}/fuzz/ob_framing_fuzzer \
            fuzz-corpus-${{ matrix.preset }} \
            -max_total_time=600 \
            -print_final_stats=1 \
            -artifact_prefix=fuzz-artifacts/
        env:
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.preset }}
          path: fuzz-artifacts/
          if-no-files-found: ignore
