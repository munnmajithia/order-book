name: CI

on:
  push:
    branches: ["main", "munn/**"]
  pull_request:

jobs:
  build-test:
    name: ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset:
          - gcc-debug
          - gcc-release
          - gcc-asan
          - gcc-ubsan
          - gcc-tsan
          - clang-debug
          - clang-release
          - clang-asan
          - clang-ubsan
          - clang-tsan
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          # Retry with a per-attempt timeout: a hung apt mirror otherwise stalls
          # the whole job until the runner limit instead of failing fast.
          for i in 1 2 3 4 5; do
            sudo timeout 150 apt-get update \
              && sudo timeout 240 apt-get install -y ninja-build libclang-rt-18-dev \
              && exit 0
            echo "apt attempt $i failed or timed out; retrying in 10s" >&2
            sleep 10
          done
          echo "apt did not succeed after 5 attempts" >&2
          exit 1
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          for i in 1 2 3 4 5; do
            sudo timeout 150 apt-get update \
              && sudo timeout 240 apt-get install -y ninja-build clang-tidy-18 clang-format-18 \
              && exit 0
            echo "apt attempt $i failed or timed out; retrying in 10s" >&2
            sleep 10
          done
          echo "apt did not succeed after 5 attempts" >&2
          exit 1
      - name: clang-format
        run: |
          git ls-files '*.cpp' '*.hpp' | xargs clang-format-18 --dry-run --Werror
      - name: Configure (for compile_commands.json)
        run: cmake --preset clang-debug
      - name: clang-tidy
        run: |
          git ls-files '*.cpp' | xargs run-clang-tidy-18 -quiet -p build/clang-debug
