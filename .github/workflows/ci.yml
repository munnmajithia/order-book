name: CI

on:
  push:
    branches: ["main", "munn/**"]
  pull_request:

jobs:
  build-test:
    name: ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset:
          - gcc-debug
          - gcc-release
          - gcc-asan
          - gcc-ubsan
          - gcc-tsan
          - clang-debug
          - clang-release
          - clang-asan
          - clang-ubsan
          - clang-tsan
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libclang-rt-18-dev
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  fuzz-smoke:
    name: fuzz-smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libclang-rt-18-dev
      - name: Configure
        run: cmake --preset clang-fuzz
      - name: Build
        run: cmake --build --preset clang-fuzz
      - name: Seed corpus and fuzz briefly
        run: |
          python3 fuzz/make_seeds.py tests/data/fixture.itch build/seeds
          mkdir -p build/corpus
          ./build/clang-fuzz/fuzz/ob_itch_fuzz build/corpus build/seeds -max_total_time=60
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-smoke-crashes
          path: |
            crash-*
            oom-*
            timeout-*
          if-no-files-found: ignore

  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang-tidy-18 clang-format-18
      - name: clang-format
        run: |
          git ls-files '*.cpp' '*.hpp' | xargs clang-format-18 --dry-run --Werror
      - name: Configure (for compile_commands.json)
        run: cmake --preset clang-debug
      - name: clang-tidy
        run: |
          git ls-files '*.cpp' | xargs run-clang-tidy-18 -quiet -p build/clang-debug
